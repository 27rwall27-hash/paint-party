<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Suite</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1b1620;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #fff;
        padding: 24px;
      }
      main {
        width: min(92vw, 760px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.5px;
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        width: 100%;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #241f29;
        border: 2px solid transparent;
        border-radius: 14px;
        padding: 32px 20px;
        text-decoration: none;
        color: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .card:hover {
        border-color: #ffd60a;
        transform: translateY(-2px);
      }
      .card .icon {
        font-size: 40px;
      }
      .card .name {
        font-size: 17px;
        font-weight: 700;
      }
      .card .tagline {
        font-size: 12px;
        color: #a99fb3;
        text-align: center;
      }
      .card.disabled {
        opacity: 0.6;
      }
      .card.disabled:hover {
        border-color: transparent;
        transform: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Game Suite</h1>
      <div class="games">
        <a class="card" href="/paint-party/">
          <span class="icon">🎨</span>
          <span class="name">Paint Party</span>
          <span class="tagline">Splat-paint outlines against the clock, solo or online.</span>
        </a>
        <a class="card" href="/stampede-sprint/">
          <span class="icon">🏃</span>
          <span class="name">Stampede Sprint</span>
          <span class="tagline">8-racer endless-runner showdown — click to jump, don't get sent to the back.</span>
        </a>
      </div>
    </main>
  </body>
</html>
