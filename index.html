<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint Party</title>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="hud">
          <span id="hudRound"></span>
          <span id="hudTimer"></span>
          <span id="hudScores"></span>
        </div>
        <canvas id="game" width="1280" height="720"></canvas>
      </div>

      <details id="playerSetup">
        <summary>Player Names &amp; Colors</summary>
        <p class="settingsHint">Customize each local player before starting a match.</p>
        <div class="settingsRow" data-slot="0">
          <input class="playerNameInput" data-slot="0" type="text" maxlength="12" placeholder="P1" />
          <input class="playerColorInput" data-slot="0" type="color" value="#e63946" />
        </div>
        <div class="settingsRow" data-slot="1">
          <input class="playerNameInput" data-slot="1" type="text" maxlength="12" placeholder="P2" />
          <input class="playerColorInput" data-slot="1" type="color" value="#3a86ff" />
        </div>
        <div class="settingsRow" data-slot="2">
          <input class="playerNameInput" data-slot="2" type="text" maxlength="12" placeholder="P3" />
          <input class="playerColorInput" data-slot="2" type="color" value="#ffd60a" />
        </div>
        <div class="settingsRow" data-slot="3">
          <input class="playerNameInput" data-slot="3" type="text" maxlength="12" placeholder="P4" />
          <input class="playerColorInput" data-slot="3" type="color" value="#2ecc71" />
        </div>
      </details>

      <details id="online">
        <summary>Play Online (beta)</summary>
        <p class="settingsHint">
          Create a room and share the 4-letter code with friends, or enter a code someone shared
          with you. Everyone online plays with WASD to move and Space to paint, regardless of
          which slot they're assigned.
        </p>
        <div class="settingsRow">
          <input id="onlineNameInput" type="text" placeholder="Your name" maxlength="12" />
          <input id="onlineColorInput" type="color" value="#e63946" />
        </div>
        <div class="settingsRow">
          <button id="onlineCreateBtn" type="button">Create Room</button>
        </div>
        <div class="settingsRow">
          <input id="onlineJoinCode" type="text" placeholder="Code" maxlength="4" />
          <button id="onlineJoinBtn" type="button">Join</button>
        </div>
        <p id="onlineStatus"></p>
        <ul id="onlinePlayerList"></ul>
        <div class="settingsRow">
          <button id="onlineStartBtn" type="button" hidden>Start Match</button>
        </div>
      </details>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
